<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Definitive Dark Mode</title>
  <style>
    body {
      width: 310px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 13px;
    }

    h2 {
      font-size: 15px;
      margin: 0 0 12px 0;
      text-align: center;
      color: #fff;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      cursor: pointer;
    }

    select {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    input[type="color"] {
      border: 1px solid #444;
      background: none;
      width: 40px;
      height: 24px;
      padding: 0;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    button {
      flex: 1;
      background: #2563eb;
      color: white;
      border: none;
      padding: 7px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 11px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.btn-ignore {
      background: #b45309;
    }

    button.btn-ignore:hover {
      background: #92400e;
    }

    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 12px 0;
    }

    .tabs {
      display: flex;
      margin-bottom: 8px;
      border-bottom: 1px solid #333;
    }

    .tab-btn {
      flex: 1;
      background: none;
      color: #888;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 6px 0;
      font-size: 12px;
      border-radius: 0;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom: 2px solid #2563eb;
      background: none;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 110px;
      overflow-y: auto;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2a2a2a;
      padding: 5px 8px;
      margin-bottom: 5px;
      border-radius: 4px;
      font-size: 12px;
      word-break: break-all;
    }

    .del-btn {
      width: auto;
      flex: none;
      background: #ef4444;
      padding: 2px 6px;
      font-size: 11px;
      margin: 0 0 0 8px;
    }

    .del-btn:hover {
      background: #dc2626;
    }

    .empty-msg {
      color: #777;
      text-align: center;
      font-style: italic;
    }

    .disabled-group {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <h2 data-i18n="title">Modo Escuro</h2>

  <div class="row">
    <label for="enableExtension" data-i18n="enableExtension">Ativar Extensão</label>
    <input type="checkbox" id="enableExtension">
  </div>

  <div class="row">
    <label for="applyAll" data-i18n="applyAll">Ativar para todos os sites</label>
    <input type="checkbox" id="applyAll">
  </div>

  <div class="row">
    <label for="mode" data-i18n="method">Método</label>
    <select id="mode">
      <option value="custom" data-i18n="customColors">Cores Personalizadas</option>
      <option value="invert" data-i18n="invertColors">Inversão Inteligente</option>
    </select>
  </div>

  <hr>

  <div id="customColorsGroup">
    <div class="row">
      <label for="bgColor" data-i18n="bgColor">Cor do Fundo</label>
      <input type="color" id="bgColor" value="#121212">
    </div>

    <div class="row">
      <label for="textColor" data-i18n="textColor">Cor do Texto</label>
      <input type="color" id="textColor" value="#e0e0e0">
    </div>
  </div>

  <hr>

  <div class="url-section">
    <label for="urlInput" data-i18n="urlPatternLabel"
      style="font-weight: 500; font-size: 11px; color: #aaa; display: block; margin-bottom: 4px;">Padrão de URL (ex:
      www.site.com/* ou *.site.com/*)</label>
    <input type="text" id="urlInput" data-i18n-placeholder="urlInputPlaceholder" placeholder="www.site.com/*"
      style="width: 100%; box-sizing: border-box; background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; padding: 6px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 6px;" />
  </div>

  <div class="btn-group">
    <button id="addCurrentActive" data-i18n="addActive">Ativar Padrão</button>
    <button id="addCurrentIgnored" class="btn-ignore" data-i18n="addIgnored">Ignorar Padrão</button>
  </div>

  <div class="tabs" style="margin-top: 10px;">
    <button class="tab-btn active" id="tabActive" data-i18n="tabActive">Ativos</button>
    <button class="tab-btn" id="tabIgnored" data-i18n="tabIgnored">Ignorados</button>
  </div>

  <ul id="activeList"></ul>
  <ul id="ignoredList" style="display: none;"></ul>

  <script src="popup.js"></script>
</body>

</html>
